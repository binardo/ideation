[project]
name = "app"
version = "0.1.0"
description = "Ideation backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.121.1",
    "psycopg[binary]>=3.2.12",
    "openai>=2.7.2",
    "python-dotenv>=1.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
