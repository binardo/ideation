<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Static Pages</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #020617;
      color: #e5e7eb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #f8fafc;
    }

    .subtitle {
      color: #94a3b8;
      margin-bottom: 32px;
      font-size: 1rem;
    }

    .pages-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .pages-list li {
      margin-bottom: 12px;
    }

    .pages-list a {
      display: block;
      padding: 16px 20px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 12px;
      color: #38bdf8;
      text-decoration: none;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    .pages-list a:hover {
      background: rgba(30, 41, 59, 0.9);
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateX(4px);
    }

    .pages-list a .page-title {
      font-weight: 500;
      margin-bottom: 4px;
    }

    .pages-list a .page-description {
      font-size: 0.875rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Static Pages</h1>
    <p class="subtitle">Browse the collection of standalone HTML pages</p>
    
    <ul class="pages-list">
      <li>
        <a href="zombie.html">
          <div class="page-title">Soldiers vs Zombies Simulation</div>
          <div class="page-description">An interactive battle simulation between soldiers and zombies with configurable parameters</div>
        </a>
      </li>
    </ul>
  </div>
</body>
</html>
