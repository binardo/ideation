services:
  # Backend FastAPI Service
  - type: web
    name: ideation-backend
    runtime: python
    region: oregon
    buildCommand: cd ideation-backend && pip install uv && uv sync
    startCommand: cd ideation-backend && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.0
    healthCheckPath: /docs

  # Frontend React Static Site
  - type: web
    name: ideation-frontend
    runtime: static
    region: oregon
    buildCommand: cd ideation-frontend && npm install && npm run build
    staticPublishPath: ideation-frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ideation-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

